server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # documento 3, §2.2 e RNF-033/034: CSP restritiva na página de checkout,
    # sem origem externa aceita para imagem de personalização (AM-20), e
    # HSTS/TLS em toda comunicação (RNF-018). Espelha
    # com.paysi.config.SecurityHeadersFilter do backend.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://api.paysi.com.br; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; connect-src 'self' https://api.paysi.com.br; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

