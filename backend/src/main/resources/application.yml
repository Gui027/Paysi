spring:
  application:
    name: paysi-backend
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/paysi}
    username: ${DATABASE_USER:paysi_app}
    password: ${DATABASE_PASSWORD:paysi_app}
    hikari:
      maximum-pool-size: 10
      auto-commit: false
  flyway:
    enabled: true
    user: ${DATABASE_MIGRATION_USER:paysi}
    password: ${DATABASE_MIGRATION_PASSWORD:paysi}
    validate-migration-naming: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

server:
  shutdown: graceful
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

paysi:
  provider: ${PAYSI_PROVIDER:fake}
  web-base-url: ${PAYSI_WEB_BASE_URL:http://localhost:3000}
  asset:
    storage-path: ${PAYSI_ASSET_STORAGE_PATH:./data/assets}
    public-base-url: ${PAYSI_PUBLIC_API_URL:http://localhost:8080}
  checkout:
    legal:
      terms-url: ${PAYSI_CHECKOUT_TERMS_URL:https://paysi.com.br/termos}
      privacy-url: ${PAYSI_CHECKOUT_PRIVACY_URL:https://paysi.com.br/privacidade}
  mail:
    from: ${PAYSI_MAIL_FROM:nao-responda@paysi.local}
  session:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  kyc:
    provider-base-url: ${KYC_PROVIDER_BASE_URL:https://kyc.local/process}
    webhook-secret: ${KYC_WEBHOOK_SECRET:}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY_BASE64:}
  payout:
    mfa-threshold-cents: ${PAYOUT_MFA_THRESHOLD_CENTS:100000}
  payment:
    fake-outcome: ${PAYMENT_FAKE_OUTCOME:APPROVED}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-payment-webhook-secret}
