spring:
  flyway:
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    root: INFO
    com.paysi: INFO

paysi:
  provider: ${PAYSI_PROVIDER}
  kyc:
    webhook-secret: ${KYC_WEBHOOK_SECRET}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY_BASE64}
  payout:
    mfa-threshold-cents: ${PAYOUT_MFA_THRESHOLD_CENTS:100000}
  payment:
    fake-outcome: ${PAYMENT_FAKE_OUTCOME:APPROVED}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
