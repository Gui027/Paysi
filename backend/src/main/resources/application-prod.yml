spring:
  flyway:
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  level:
    root: INFO
    com.paysi: INFO

# Atrás do Traefik: sem isso request.getRemoteAddr() devolve o IP do proxy, e o limite por IP e a
# evidência de venda (IP do comprador) ficariam errados.
server:
  forward-headers-strategy: framework

# Documentação interativa da API não fica exposta em produção.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

paysi:
  provider: ${PAYSI_PROVIDER}
  security:
    allowed-origins: ${PAYSI_ALLOWED_ORIGINS:http://localhost:5173}
  kyc:
    provider: ${KYC_PROVIDER:configured}
    webhook-secret: ${KYC_WEBHOOK_SECRET}
  mfa:
    encryption-key: ${MFA_ENCRYPTION_KEY_BASE64}
  payout:
    mfa-threshold-cents: ${PAYOUT_MFA_THRESHOLD_CENTS:100000}
  payment:
    fake-outcome: ${PAYMENT_FAKE_OUTCOME:APPROVED}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
  asaas:
    api-key: ${ASAAS_API_KEY:}
    base-url: ${ASAAS_BASE_URL:https://api.asaas.com/v3}
    webhook-token: ${ASAAS_WEBHOOK_TOKEN:}
