name: Segurança contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  trivy:
    name: Dependências, segredos e configuração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Varredura do repositório
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Evita falhas transitórias por rate limit dos repositórios Maven.
          TRIVY_OFFLINE_SCAN: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.76.2

  dast:
    name: DAST passivo do site público
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://paysi.com.br/
          allow_issue_writing: true
          fail_action: false
