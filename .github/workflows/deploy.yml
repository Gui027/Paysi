name: Deploy

# Só roda depois que o CI da main passou. Publica as imagens no ghcr.io com a tag do commit e
# manda o Portainer atualizar o stack (YAML vindo do git + PAYSI_IMAGE_TAG novo), sem tocar
# nas demais variáveis do stack.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: backend, dockerfile: backend/Dockerfile }
          - { name: painel, dockerfile: web-painel/Dockerfile }
          - { name: checkout, dockerfile: web-checkout/Dockerfile }
          - { name: site, dockerfile: web-site/Dockerfile }
          - { name: postgres, dockerfile: infra/postgres/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: meta
        run: |
          echo "tag=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/paysi-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          # VITE_API_URL é embutido no bundle do checkout em tempo de build.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.paysi.com.br' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  kvm2:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Preparar acesso SSH ao KVM2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KVM2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KVM2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/paysi-kvm2
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/paysi-kvm2 ~/.ssh/known_hosts

      - name: Transferir configuração do Portainer antigo no primeiro deploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
          KVM2_HOST: ${{ secrets.KVM2_HOST }}
          KVM2_USER: ${{ secrets.KVM2_USER }}
        run: |
          set -euo pipefail
          for v in PORTAINER_URL PORTAINER_TOKEN STACK_ID KVM2_HOST KVM2_USER; do
            [ -n "${!v}" ] || { echo "::error::secret $v não configurado"; exit 1; }
          done
          SSH=(ssh -i ~/.ssh/paysi-kvm2 "$KVM2_USER@$KVM2_HOST")
          if "${SSH[@]}" test -s /opt/paysi/.env; then
            echo "Configuração segura já existe no KVM2"
            exit 0
          fi
          curl -fsSk -H "X-API-Key: $PORTAINER_TOKEN" "$PORTAINER_URL/api/stacks/$STACK_ID" \
            | jq -r '.Env | map(select(.name != "PAYSI_IMAGE_TAG"))[] | "\(.name)=\(.value | @json)"' \
            > paysi.env
          test -s paysi.env || { echo "::error::não foi possível obter as variáveis da stack antiga"; exit 1; }
          scp -i ~/.ssh/paysi-kvm2 paysi.env "$KVM2_USER@$KVM2_HOST:/opt/paysi/.env"
          "${SSH[@]}" chmod 600 /opt/paysi/.env
          rm -f paysi.env
          echo "Configuração transferida sem expor valores"

      - name: Publicar stack no KVM2
        env:
          KVM2_HOST: ${{ secrets.KVM2_HOST }}
          KVM2_USER: ${{ secrets.KVM2_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/paysi-kvm2 "$KVM2_USER@$KVM2_HOST")
          scp -i ~/.ssh/paysi-kvm2 infra/kvm2-compose.yml "$KVM2_USER@$KVM2_HOST:/opt/paysi/compose.yml"
          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" docker login ghcr.io -u "$GHCR_USER" --password-stdin
          "${SSH[@]}" "cd /opt/paysi && PAYSI_IMAGE_TAG='$TAG' docker compose --env-file .env -f compose.yml up -d --pull always --remove-orphans"
          echo "Stack atualizada para a tag $TAG"

      - name: Esperar o backend ficar saudável
        env:
          KVM2_HOST: ${{ secrets.KVM2_HOST }}
          KVM2_USER: ${{ secrets.KVM2_USER }}
        run: |
          SSH=(ssh -i ~/.ssh/paysi-kvm2 "$KVM2_USER@$KVM2_HOST")
          for i in $(seq 1 40); do
            if "${SSH[@]}" "curl -fsS -m 8 http://127.0.0.1:8090/actuator/health" | grep -q UP; then
              echo "Backend saudável"; exit 0
            fi
            sleep 15
          done
          echo "::error::o backend não ficou saudável em 10 minutos"; exit 1
