name: Deploy

# Só roda depois que o CI da main passou. Publica as imagens no ghcr.io com a tag do commit e
# atualiza a stack do KVM2 por SSH, preservando as variáveis de produção no próprio servidor.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: backend, dockerfile: backend/Dockerfile }
          - { name: painel, dockerfile: web-painel/Dockerfile }
          - { name: checkout, dockerfile: web-checkout/Dockerfile }
          - { name: site, dockerfile: web-site/Dockerfile }
          - { name: postgres, dockerfile: infra/postgres/Dockerfile }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: meta
        run: |
          echo "tag=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/paysi-${{ matrix.name }}:${{ steps.meta.outputs.tag }}
          # VITE_API_URL é embutido no bundle do checkout em tempo de build.
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.paysi.com.br' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  kvm2:
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Preparar acesso SSH ao KVM2
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KVM2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.KVM2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/paysi-kvm2
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/paysi-kvm2 ~/.ssh/known_hosts

      - name: Publicar stack no KVM2
        env:
          KVM2_HOST: ${{ secrets.KVM2_HOST }}
          KVM2_USER: ${{ secrets.KVM2_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Credencial de produção mantida no cofre do GitHub Environment.
          # Ela segue pelo canal SSH apenas na memória do processo remoto e
          # nunca é persistida no /opt/paysi/.env nem copiada para uma imagem.
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          MFA_ENCRYPTION_KEY_BASE64: ${{ secrets.MFA_ENCRYPTION_KEY_BASE64 }}
          GHCR_USER: ${{ github.actor }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$ASAAS_API_KEY" || { echo "::error::secret ASAAS_API_KEY ausente no environment staging"; exit 1; }
          test -n "$MFA_ENCRYPTION_KEY_BASE64" || { echo "::error::secret MFA_ENCRYPTION_KEY_BASE64 ausente no environment staging"; exit 1; }
          SSH=(ssh -i ~/.ssh/paysi-kvm2 "$KVM2_USER@$KVM2_HOST")
          "${SSH[@]}" test -s /opt/paysi/.env || { echo "::error::/opt/paysi/.env não encontrado"; exit 1; }
          PREVIOUS_TAG="$("${SSH[@]}" "cd /opt/paysi && if test -s current-tag; then cat current-tag; else docker inspect --format='{{.Config.Image}}' paysi-backend-1 2>/dev/null | sed 's/.*://'; fi")"
          [[ "$PREVIOUS_TAG" =~ ^[0-9a-f]{7}$ ]] || { echo "::error::não foi possível determinar a versão anterior"; exit 1; }
          printf '%s\n' "$PREVIOUS_TAG" | "${SSH[@]}" "cat > /opt/paysi/previous-tag"
          scp -i ~/.ssh/paysi-kvm2 infra/kvm2-compose.yml "$KVM2_USER@$KVM2_HOST:/opt/paysi/compose.yml"
          scp -i ~/.ssh/paysi-kvm2 infra/backup-paysi.sh "$KVM2_USER@$KVM2_HOST:/opt/paysi/backup.sh"
          "${SSH[@]}" chmod 700 /opt/paysi/backup.sh
          printf '%s' "$GHCR_TOKEN" | "${SSH[@]}" docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Remove eventual cópia legada antes de subir a stack. A credencial é
          # lida do stdin e exportada somente para este processo do Compose.
          "${SSH[@]}" sed -i -e '/^ASAAS_API_KEY=/d' -e '/^MFA_ENCRYPTION_KEY_BASE64=/d' /opt/paysi/.env
          printf '%s\n%s\n' "$ASAAS_API_KEY" "$MFA_ENCRYPTION_KEY_BASE64" | "${SSH[@]}" "
            IFS= read -r ASAAS_API_KEY
            IFS= read -r MFA_ENCRYPTION_KEY_BASE64
            export ASAAS_API_KEY
            export MFA_ENCRYPTION_KEY_BASE64
            cd /opt/paysi
            PAYSI_IMAGE_TAG='$TAG' docker compose --env-file .env -f compose.yml up -d --pull always --remove-orphans
          "
          echo "Stack atualizada para a tag $TAG"

      - name: Esperar a aplicação ficar saudável
        env:
          KVM2_HOST: ${{ secrets.KVM2_HOST }}
          KVM2_USER: ${{ secrets.KVM2_USER }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          MFA_ENCRYPTION_KEY_BASE64: ${{ secrets.MFA_ENCRYPTION_KEY_BASE64 }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/paysi-kvm2 "$KVM2_USER@$KVM2_HOST")
          for i in $(seq 1 40); do
            if "${SSH[@]}" "curl -fsS -m 8 http://127.0.0.1:8090/actuator/health | grep -q UP && curl -fsS -m 8 http://127.0.0.1:5180/health >/dev/null && curl -fsS -m 8 http://127.0.0.1:3020/ >/dev/null && curl -fsS -m 8 http://127.0.0.1:3030/ >/dev/null"; then
              "${SSH[@]}" "printf '%s\\n' '$TAG' > /opt/paysi/current-tag && rm -f /opt/paysi/previous-tag"
              echo "Aplicação saudável"; exit 0
            fi
            sleep 15
          done
          PREVIOUS_TAG="$("${SSH[@]}" cat /opt/paysi/previous-tag 2>/dev/null || true)"
          if [[ "$PREVIOUS_TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "Aplicação não ficou saudável; restaurando a versão $PREVIOUS_TAG"
            printf '%s\n%s\n' "$ASAAS_API_KEY" "$MFA_ENCRYPTION_KEY_BASE64" | "${SSH[@]}" "
              IFS= read -r ASAAS_API_KEY
              IFS= read -r MFA_ENCRYPTION_KEY_BASE64
              export ASAAS_API_KEY
              export MFA_ENCRYPTION_KEY_BASE64
              cd /opt/paysi
              PAYSI_IMAGE_TAG='$PREVIOUS_TAG' docker compose --env-file .env -f compose.yml up -d --pull always --remove-orphans
            "
          fi
          echo "::error::a aplicação não ficou saudável; rollback solicitado"; exit 1
